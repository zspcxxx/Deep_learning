[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dllab"
version = "0.3.0"
description = "Deep learning tutorial lab: perceptron to a full training pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "flask>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
