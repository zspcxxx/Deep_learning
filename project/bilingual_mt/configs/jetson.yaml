# Jetson：儿童口语合集 20 万句，中等模型
inherit: base.yaml
name: bilingual_jetson

data:
  dataset: kids-mix
  direction: both
  max_pairs: 200000

vocab:
  vocab_size: 12000

model:
  d_model: 384
  n_heads: 6
  n_enc_layers: 4
  n_dec_layers: 4
  d_ff: 1536
  dropout: 0.15

train:
  epochs: 12
  batch_size: 64
  lr: 5.0e-4
  warmup_steps: 2000
  patience: 3
  amp: true
  device: cuda

decode:
  beam_size: 4
  max_decode_len: 40
