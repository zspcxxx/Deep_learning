# 儿童口语中英互译（推荐）：儿童口语合集 5 万句、both 方向
inherit: base.yaml
name: bilingual_kids

data:
  dataset: kids-mix
  direction: both
  max_pairs: 50000
  val_ratio: 0.03
  test_ratio: 0.03

vocab:
  vocab_size: 8000

model:
  d_model: 256
  n_heads: 4
  n_enc_layers: 3
  n_dec_layers: 3
  d_ff: 1024
  dropout: 0.1

train:
  epochs: 20
  batch_size: 64
  lr: 7.0e-4
  schedule: cosine
  warmup_steps: 1000
  patience: 4
  amp: true
  device: auto

decode:
  beam_size: 4
  max_decode_len: 40
