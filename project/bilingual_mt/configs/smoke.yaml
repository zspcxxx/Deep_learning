# 本地冒烟：复用已下载的 news-commentary，极少数据 / 极小模型
inherit: base.yaml
name: smoke

data:
  dataset: news-commentary
  direction: both
  max_pairs: 2000
  max_src_len: 40
  max_tgt_len: 40
  val_ratio: 0.05
  test_ratio: 0.05

vocab:
  vocab_size: 4000

model:
  d_model: 128
  n_heads: 4
  n_enc_layers: 2
  n_dec_layers: 2
  d_ff: 256
  dropout: 0.1

train:
  epochs: 1
  batch_size: 32
  lr: 1.0e-3
  schedule: cosine
  warmup_steps: 50
  patience: 0
  amp: false
  device: cpu

decode:
  beam_size: 1
  max_decode_len: 40
