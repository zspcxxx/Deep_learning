# 小模型 / 日常短句（kids-tatoeba，约 3.8k 句），Jetson 上快速验证
inherit: base.yaml
name: bilingual_tiny

data:
  dataset: kids-tatoeba
  direction: both
  max_pairs: 0
  val_ratio: 0.05
  test_ratio: 0.05

vocab:
  vocab_size: 2000

model:
  d_model: 128
  n_heads: 4
  n_enc_layers: 2
  n_dec_layers: 2
  d_ff: 512
  dropout: 0.1

train:
  epochs: 40
  batch_size: 64
  lr: 1.0e-3
  schedule: cosine
  warmup_steps: 200
  patience: 5
  amp: true

decode:
  beam_size: 4
  max_decode_len: 40
