# 小模型 / 短句语料，适合本机冒烟或 Jetson 快速验证
inherit: base.yaml
name: bilingual_tiny

data:
  dataset: cmn-eng
  direction: both
  max_pairs: 20000
  max_src_len: 32
  max_tgt_len: 32

vocab:
  vocab_size: 4000

model:
  d_model: 256
  n_heads: 4
  n_enc_layers: 3
  n_dec_layers: 3
  d_ff: 512
  dropout: 0.1

train:
  epochs: 10
  batch_size: 64
  lr: 1.0e-3
  schedule: cosine
  warmup_steps: 500
  patience: 3
  amp: true

decode:
  beam_size: 3
  max_decode_len: 40
